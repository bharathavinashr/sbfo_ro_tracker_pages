resources:
  apps:
    sbfo_ro_tracker:
      name: sbfo-ro-tracker
      description: SBFO Risk & Opportunities Tracker - Vue + FastAPI Application

      resources:
        - name: db_url_secret
          secret:
            scope: my-app-secrets
            key: DATABASE_URL
            permission: READ

      config:
        env:
          - name: DATABASE_URL
            valueFrom: db_url_secret

      source_code_path: .